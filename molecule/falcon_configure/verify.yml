---
# This is an example playbook to execute Ansible tests.

- name: Verify
  hosts: all
  become: yes
  tasks:
  - name: Get list of Falcon Sensor Options
    crowdstrike.falcon.falconctl_info:
    register: info_verify

  - name: Verify Falcon Sensor options are set
    ansible.builtin.assert:
      that:
        - info_verify.falconctl_info.cid
        - info_verify.falconctl_info.billing
        - info_verify.falconctl_info.tags
        - not info_verify.falconctl_info.apd
        - not info_verify.falconctl_info.aph
        - not info_verify.falconctl_info.app
        - not info_verify.falconctl_info.trace

  - name: Sensor tags_list block
    block:
      - name: Test adding a tag with tags_list
        crowdstrike.falcon.falconctl:
          state: present
          tags_list:
            - tag3
        register: tags_add

      - name: Test adding the same tag again with tags_list
        crowdstrike.falcon.falconctl:
          state: present
          tags_list:
            - tag3
        register: tags_add_again

      - name: Get Falcon Sensor tags after adding a tag
        crowdstrike.falcon.falconctl_info:
          name: 'tags'
        register: tags_add_info

      - name: Verify tag was added and existing tags were kept
        ansible.builtin.assert:
          that:
            - tags_add is changed
            - tags_add_again is not changed
            - tags_add_info.falconctl_info.tags.split(',') | sort == ['molecule', 'tag3', 'testing']

      - name: Test removing a tag with tags_list
        crowdstrike.falcon.falconctl:
          state: absent
          tags_list:
            - tag3
        register: tags_remove

      - name: Get Falcon Sensor tags after removing a tag
        crowdstrike.falcon.falconctl_info:
          name: 'tags'
        register: tags_remove_info

      - name: Verify only the listed tag was removed
        ansible.builtin.assert:
          that:
            - tags_remove is changed
            - tags_remove_info.falconctl_info.tags.split(',') | sort == ['molecule', 'testing']

      - name: Test setting exclusive tags with tags_list
        crowdstrike.falcon.falconctl:
          state: present
          exclusive: true
          tags_list:
            - molecule
        register: tags_exclusive

      - name: Get Falcon Sensor tags after setting exclusive tags
        crowdstrike.falcon.falconctl_info:
          name: 'tags'
        register: tags_exclusive_info

      - name: Verify unlisted tags were removed
        ansible.builtin.assert:
          that:
            - tags_exclusive is changed
            - tags_exclusive_info.falconctl_info.tags == 'molecule'

    always:
      - name: Restore original Falcon Sensor tags
        crowdstrike.falcon.falconctl:
          state: present
          tags: 'molecule,testing'

  - name: Test Setting Proxy Options
    ansible.builtin.include_role:
      name: crowdstrike.falcon.falcon_configure
    vars:
      falcon_apd: no
      falcon_aph: 'example.com'
      falcon_app: 8080

  - name: Get list of Falcon Sensor Proxy Options
    crowdstrike.falcon.falconctl_info:
    register: proxy_info

  - name: Verify Falcon Sensor Proxy options are set
    ansible.builtin.assert:
      that:
        - proxy_info.falconctl_info.apd == 'FALSE'
        - proxy_info.falconctl_info.aph == 'example.com'
        - proxy_info.falconctl_info.app == '8080'

  - name: Test Deleting Options
    ansible.builtin.include_role:
      name: crowdstrike.falcon.falcon_configure
    vars:
      falcon_option_set: no
      falcon_cid: ""
      falcon_billing: ""
      falcon_apd: ""
      falcon_aph: ""
      falcon_app: ""

  - name: AID deletion block
    when: info_verify.falconctl_info.aid
    block:
      - name: Test Deleting AID master image prep
        ansible.builtin.include_role:
          name: crowdstrike.falcon.falcon_configure
        vars:
          falcon_remove_aid: yes

      - name: Get Updated Falcon Sensor Option
        crowdstrike.falcon.falconctl_info:
        register: delete_info

      - name: Verify Falcon Sensor options are not set
        ansible.builtin.assert:
          that:
            - not delete_info.falconctl_info.aid
            - not delete_info.falconctl_info.cid
            - not delete_info.falconctl_info.apd
            - not delete_info.falconctl_info.aph
            - not delete_info.falconctl_info.app

  - name: Auto-detect CID block
    become: no
    block:
      - name: Test auto-detecting CID
        ansible.builtin.include_role:
          name: crowdstrike.falcon.falcon_configure
        vars:
          falcon_client_id: "{{ lookup('env', 'FALCON_CLIENT_ID') }}"
          falcon_client_secret: "{{ lookup('env', 'FALCON_CLIENT_SECRET') }}"

  - name: Get CID Option
    crowdstrike.falcon.falconctl_info:
      name: 'cid'
    register: autodetect_info

  - name: Verify CID was configured
    ansible.builtin.assert:
      that: autodetect_info.falconctl_info.cid
