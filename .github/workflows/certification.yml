---
# Runs the Automation Hub import checks (galaxy-importer, ansible-lint on
# the built artifact, sanity) from the Red Hat partner certification checker:
# https://github.com/ansible-collections/partner-certification-checker
name: Certification checks

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: cert-ver-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  call:
    uses: ansible-collections/partner-certification-checker/.github/workflows/certification-reusable.yml@0b3575fff9a50e8057134e01862c52450648c3fc # v6.0.0
    with:
      collection-deps: "ansible.windows"
