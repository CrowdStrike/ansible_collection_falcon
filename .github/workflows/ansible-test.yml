name: Ansible Test

on:
  push:
    branches: [ main ]
    paths:
      - 'galaxy.yml'
      - 'plugins/**'
      - 'tests/unit/**'
      - '.github/workflows/ansible-test.yml'

  pull_request:
    paths:
      - 'galaxy.yml'
      - 'plugins/**'
      - 'tests/unit/**'
      - '.github/workflows/ansible-test.yml'

permissions:
  contents: read

jobs:
  ansible-test:
    name: sanity (${{ matrix.ansible }})
    runs-on: ubuntu-latest
    # devel can break at any time, so it only reports.
    continue-on-error: ${{ matrix.ansible == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (meta/runtime.yml), the previous CI version, the
        # newest stable versions, and devel. Each core version supports a
        # different range of controller Python versions.
        include:
          - ansible: stable-2.16
            python: '3.12'
          - ansible: stable-2.18
            python: '3.12'
          - ansible: stable-2.20
            python: '3.13'
          - ansible: stable-2.21
            python: '3.13'
          - ansible: stable-2.22
            python: '3.13'
          - ansible: devel
            python: '3.13'
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1
      COLLECTION_PATH: ansible_collections/crowdstrike/falcon

    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz

      - name: Clean non-collection files
        working-directory: ${{ env.COLLECTION_PATH }}
        run: rm -rf .devcontainer/ .git* .pre-commit-config.yaml

      - name: Run sanity tests
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-test sanity -v --docker

  units:
    name: units (${{ matrix.ansible }})
    runs-on: ubuntu-latest
    # devel can break at any time, so it only reports.
    continue-on-error: ${{ matrix.ansible == 'devel' }}
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (meta/runtime.yml), the previous CI version, the
        # newest stable versions, and devel. Each core version supports a
        # different range of controller Python versions.
        include:
          - ansible: stable-2.16
            python: '3.12'
          - ansible: stable-2.18
            python: '3.12'
          - ansible: stable-2.20
            python: '3.13'
          - ansible: stable-2.21
            python: '3.13'
          - ansible: stable-2.22
            python: '3.13'
          - ansible: devel
            python: '3.13'
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1
      COLLECTION_PATH: ansible_collections/crowdstrike/falcon

    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible-core (${{ matrix.ansible }})
        run: pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz

      - name: Clean non-collection files
        working-directory: ${{ env.COLLECTION_PATH }}
        run: rm -rf .devcontainer/ .git* .pre-commit-config.yaml

      - name: Run unit tests
        working-directory: ${{ env.COLLECTION_PATH }}
        run: ansible-test units -v --docker
