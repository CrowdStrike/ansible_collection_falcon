name: Molecule

on:
  push:
    branches: [ main ]
    paths:
      - 'roles/**'
      - 'extensions/molecule/**'
      - 'plugins/modules/falconctl.py'
      - 'plugins/modules/falconctl_info.py'
      - 'plugins/module_utils/falconctl_utils.py'
      - '.github/workflows/molecule.yml'

  pull_request:
    paths:
      - 'roles/**'
      - 'extensions/molecule/**'
      - 'plugins/modules/falconctl.py'
      - 'plugins/modules/falconctl_info.py'
      - 'plugins/module_utils/falconctl_utils.py'
      - '.github/workflows/molecule.yml'

permissions:
  contents: read

jobs:
  molecule:
    name: ${{ matrix.scenario }} (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - install_file
          - install_url
          - configure
          - uninstall
        distro:
          - ubuntu2404
          - rocky9
    env:
      PY_COLORS: 1
      ANSIBLE_FORCE_COLOR: 1
      COLLECTION_PATH: ansible_collections/crowdstrike/falcon
      # Find this checkout of crowdstrike.falcon and the test dependencies
      # before any other installed collection.
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
      FALCON_TEST_DISTRO: ${{ matrix.distro }}

    steps:
      - name: Check out code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          path: ${{ env.COLLECTION_PATH }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install molecule
        run: pip install "ansible-core~=2.20.0" molecule docker

      - name: Install the test collections
        run: ansible-galaxy collection install -r tests/requirements.yml -p "${{ github.workspace }}"
        working-directory: ${{ env.COLLECTION_PATH }}

      - name: Run molecule
        run: molecule test -s ${{ matrix.scenario }}
        working-directory: ${{ env.COLLECTION_PATH }}
