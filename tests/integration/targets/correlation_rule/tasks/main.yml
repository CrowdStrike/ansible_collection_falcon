---
# Integration tests for correlation_rule and correlation_rule_info modules
#
# Requirements:
#   FALCON_CLIENT_ID     - API client ID
#   FALCON_CLIENT_SECRET - API client secret
#   FALCON_CLOUD         - Falcon cloud region (optional, defaults to us-1)
#
# API scopes: Correlation Rules [READ, WRITE], Sensor Download [READ]
#
# The Correlation Rules API has a backend provisioning phase where newly created
# rules enter a "creating" transition state. During this period, rules cannot be
# updated or deleted. These tests account for that behavior.
#
# All rule names start with a prefix that is unique to this run. The cleanup
# finds the rules of this run with a "starts with" name filter and deletes
# them by ID. That filter is case-sensitive, so the prefix is lowercase. A rule
# that is still in the "creating" state cannot be deleted yet, so the cleanup
# can leave it behind.

- name: Gather minimal facts for timestamp
  ansible.builtin.setup:
    gather_subset:
      - date_time

- name: Validate required environment variables
  ansible.builtin.assert:
    that:
      - lookup('env', 'FALCON_CLIENT_ID') | length > 0
      - lookup('env', 'FALCON_CLIENT_SECRET') | length > 0
    fail_msg: "FALCON_CLIENT_ID and FALCON_CLIENT_SECRET environment variables must be set"

- name: Set test variables
  ansible.builtin.set_fact:
    cr_prefix: "ansible-int-cr-{{ ansible_facts.date_time.iso8601_basic_short | lower }}"

- name: Set test rule names and settings
  ansible.builtin.set_fact:
    test_rule_name: "{{ cr_prefix }}-rule"
    test_search:
      filter: "#event_simpleName=ProcessRollup2"
      lookback: "5m"
      outcome: "detection"
    test_operation:
      schedule:
        definition: "*/5 * * * *"

- name: Run CRUD lifecycle tests
  block:
    # =====================================================================
    # Phase 1: CREATE
    # =====================================================================

    - name: "CREATE | Create a correlation rule"
      crowdstrike.falcon.correlation_rule:
        name: "{{ test_rule_name }}"
        severity: 30
        status: active
        search: "{{ test_search }}"
        operation: "{{ test_operation }}"
      register: create_result

    - name: "CREATE | Verify rule was created"
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.correlation_rule is defined
          - create_result.correlation_rule.name == test_rule_name
          - create_result.correlation_rule.id | length > 0
          - create_result.correlation_rule.customer_id | length > 0
          - create_result.correlation_rule.severity == 30
          - create_result.correlation_rule.search.filter == test_search.filter
          - create_result.correlation_rule.search.lookback == test_search.lookback
          - create_result.correlation_rule.search.outcome == test_search.outcome
          - create_result.correlation_rule.operation.schedule.definition == "*/5 * * * *"
        fail_msg: "Rule creation failed or returned unexpected data"

    - name: Save rule ID
      ansible.builtin.set_fact:
        rule_id: "{{ create_result.correlation_rule.id }}"

    # =====================================================================
    # Phase 2: READ - Verify via info module
    # =====================================================================

    - name: "READ | Get rule by ID"
      crowdstrike.falcon.correlation_rule_info:
        rule_ids:
          - "{{ rule_id }}"
      register: info_by_id

    - name: "READ | Verify info by ID"
      ansible.builtin.assert:
        that:
          - info_by_id.correlation_rules | length == 1
          - info_by_id.correlation_rules[0].id == rule_id
          - info_by_id.correlation_rules[0].name == test_rule_name
          - info_by_id.meta.pagination.total == 1
        fail_msg: "Info lookup by ID returned unexpected data"

    - name: "READ | Search rules by name filter"
      crowdstrike.falcon.correlation_rule_info:
        filter: "name:'{{ test_rule_name }}'"
      register: info_by_filter

    - name: "READ | Verify filter search found the rule"
      ansible.builtin.assert:
        that:
          - info_by_filter.correlation_rules | length >= 1
          - >-
            info_by_filter.correlation_rules
            | selectattr('id', 'equalto', rule_id)
            | list | length == 1
        fail_msg: "Filter search did not find the created rule"

    # =====================================================================
    # Phase 3: IDEMPOTENCY - Module skips update during transition
    # =====================================================================

    - name: "IDEMPOTENT | Re-run with same parameters (rule in transition)"
      crowdstrike.falcon.correlation_rule:
        name: "{{ test_rule_name }}"
        severity: 30
      register: idempotent_result

    - name: "IDEMPOTENT | Verify no changes during transition"
      ansible.builtin.assert:
        that:
          - idempotent_result is not changed
          - idempotent_result.correlation_rule.id == rule_id
        fail_msg: "Module should skip updates while rule is in transition state"

    # =====================================================================
    # Phase 3b: CHECK MODE
    # =====================================================================

    - name: "CHECK | Create a rule in check mode"
      crowdstrike.falcon.correlation_rule:
        name: "{{ cr_prefix }}-check"
        severity: 30
        status: active
        search: "{{ test_search }}"
        operation: "{{ test_operation }}"
      check_mode: true
      register: check_create

    - name: "CHECK | Look for the check mode rule"
      crowdstrike.falcon.correlation_rule_info:
        filter: "name:'{{ cr_prefix }}-check'"
      register: check_create_info

    - name: "CHECK | Verify check mode predicted the create and made no rule"
      ansible.builtin.assert:
        that:
          - check_create is changed
          - check_create_info.correlation_rules | length == 0
        fail_msg: "Check mode must report the create without making the rule"

    - name: "CHECK | Re-run the create of the existing rule in check mode"
      crowdstrike.falcon.correlation_rule:
        name: "{{ test_rule_name }}"
        severity: 30
      check_mode: true
      register: check_existing

    - name: "CHECK | Verify check mode found the existing rule"
      ansible.builtin.assert:
        that:
          - check_existing is not changed
          - check_existing.correlation_rule.id == rule_id
        fail_msg: "Check mode must find the existing rule and predict no change"

    - name: "CHECK | Delete the rule in check mode"
      crowdstrike.falcon.correlation_rule:
        rule_id: "{{ rule_id }}"
        state: absent
      check_mode: true
      register: check_delete

    - name: "CHECK | Confirm the rule still exists after the check mode delete"
      crowdstrike.falcon.correlation_rule_info:
        rule_ids:
          - "{{ rule_id }}"
      register: check_still_there

    - name: "CHECK | Verify check mode predicted the delete and did not delete"
      ansible.builtin.assert:
        that:
          - check_delete is changed
          - check_still_there.correlation_rules | length == 1
        fail_msg: "Check mode must report the delete without deleting the rule"

    # =====================================================================
    # Phase 3c: DELETE WHILE CREATING
    # =====================================================================

    - name: "TRANSITION | Delete the rule while it is still creating"
      crowdstrike.falcon.correlation_rule:
        rule_id: "{{ rule_id }}"
        state: absent
      register: delete_creating
      ignore_errors: true
      when: check_still_there.correlation_rules[0].status == 'creating'

    - name: "TRANSITION | Verify the delete failed with a clear message"
      ansible.builtin.assert:
        that:
          - delete_creating is failed
          - delete_creating is not changed
          - "\"is in the 'creating' status\" in delete_creating.msg"
          - "'Run the task again later' in delete_creating.msg"
        fail_msg: "A delete while the rule is creating must fail with a clear message"
      when: check_still_there.correlation_rules[0].status == 'creating'

    # =====================================================================
    # Phase 4: INFO MODULE - Pagination, sorting, latest version
    # =====================================================================

    - name: "INFO | Test pagination"
      crowdstrike.falcon.correlation_rule_info:
        limit: 5
        offset: 0
      register: info_paginated

    - name: "INFO | Verify pagination metadata"
      ansible.builtin.assert:
        that:
          - info_paginated.meta is defined
          - info_paginated.meta.pagination.limit == 5
          - info_paginated.meta.pagination.offset == 0
          - info_paginated.correlation_rules | length <= 5
        fail_msg: "Pagination metadata is incorrect"

    - name: "INFO | Test sort by last updated"
      crowdstrike.falcon.correlation_rule_info:
        sort: "last_updated_on"
        limit: 10
      register: info_sorted

    - name: "INFO | Verify sorted results returned"
      ansible.builtin.assert:
        that:
          - info_sorted.correlation_rules is defined
        fail_msg: "Sorted query failed"

    - name: "INFO | Get rule with latest version info"
      crowdstrike.falcon.correlation_rule_info:
        rule_ids:
          - "{{ rule_id }}"
        include_latest_version: true
      register: info_with_version

    - name: "INFO | Verify latest version field is present"
      ansible.builtin.assert:
        that:
          - info_with_version.correlation_rules[0].latest_version is defined
        fail_msg: "Latest version info was not included"

    # =====================================================================
    # Phase 5: AUTH TOKEN PASSTHROUGH
    # =====================================================================

    - name: "AUTH | Generate access token via auth module"
      crowdstrike.falcon.auth:
      register: falcon_auth

    - name: "AUTH | Query using access token"
      crowdstrike.falcon.correlation_rule_info:
        auth: "{{ falcon_auth.auth }}"
        rule_ids:
          - "{{ rule_id }}"
      register: auth_info

    - name: "AUTH | Verify token auth query succeeded"
      ansible.builtin.assert:
        that:
          - auth_info.correlation_rules | length == 1
        fail_msg: "Query with token auth failed"

    # =====================================================================
    # Phase 6: ABSENT IDEMPOTENCY (non-existent rule)
    # =====================================================================

    - name: "ABSENT | Delete non-existent rule by name (idempotent)"
      crowdstrike.falcon.correlation_rule:
        name: "{{ cr_prefix }}-missing"
        state: absent
      register: absent_noop

    - name: "ABSENT | Verify no change for non-existent rule"
      ansible.builtin.assert:
        that:
          - absent_noop is not changed
        fail_msg: "Absent state should be no-op for non-existent rules"

  # =======================================================================
  # ALWAYS: Best-effort cleanup
  # =======================================================================
  always:
    - name: "CLEANUP | Find any leftover test rules"
      crowdstrike.falcon.correlation_rule_info:
        filter: "name:*'{{ cr_prefix }}*'"
      register: leftover_rules
      failed_when: false

    - name: "CLEANUP | Delete leftover test rules by ID (may fail if still in transition)"
      crowdstrike.falcon.correlation_rule:
        rule_id: "{{ item.rule_id }}"
        state: absent
      loop: "{{ leftover_rules.correlation_rules | default([]) }}"
      loop_control:
        label: "{{ item.name | default(item.rule_id) }}"
      failed_when: false

    - name: "CLEANUP | Look for test rules that are still present"
      crowdstrike.falcon.correlation_rule_info:
        filter: "name:*'{{ cr_prefix }}*'"
      register: remaining_rules
      failed_when: false

    - name: "CLEANUP | Show the test rules that could not be deleted yet"
      ansible.builtin.debug:
        msg: >-
          The rule {{ item.name }} ({{ item.rule_id }}) is in the
          {{ item.status }} state and was not deleted. Delete it when it
          leaves the transition state.
      loop: "{{ remaining_rules.correlation_rules | default([]) }}"
      loop_control:
        label: "{{ item.name | default(item.rule_id) }}"
