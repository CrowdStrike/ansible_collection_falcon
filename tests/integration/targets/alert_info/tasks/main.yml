---
# Integration tests for the alert_info module
#
# Requirements:
#   FALCON_CLIENT_ID     - API client ID
#   FALCON_CLIENT_SECRET - API client secret
#   FALCON_CLOUD         - Falcon cloud region (optional, defaults to us-1)
#
# API scopes: Alerts [READ]
#
# The test only reads. Alerts cannot be created through the API, so the test
# makes no objects and has no cleanup. It does not assume which alerts a
# tenant has: it reads the newest alerts first and builds every later filter,
# ID and check from that result. Every search uses a filter or a limit, so the
# test stays light on a tenant with many alerts. Alert data is tenant data, so
# the tasks that return it use no_log and the asserts use quiet.

- name: Validate required environment variables
  ansible.builtin.assert:
    that:
      - lookup('env', 'FALCON_CLIENT_ID') | length > 0
      - lookup('env', 'FALCON_CLIENT_SECRET') | length > 0
    fail_msg: "FALCON_CLIENT_ID and FALCON_CLIENT_SECRET environment variables must be set"

- name: Run read-only alert tests
  block:
    # =====================================================================
    # Phase 1: the newest alerts, and the values that the later checks use
    # =====================================================================

    - name: "EXAMPLE | Get the 10 newest alerts"
      crowdstrike.falcon.alert_info:
        sort: created_timestamp.desc
        limit: 10
      register: al_newest
      no_log: true

    - name: "READ | Verify the limit and the newest first order"
      ansible.builtin.assert:
        that:
          - al_newest is not changed
          - al_newest.alerts | length > 0
          - al_newest.alerts | length <= 10
          - >-
            al_newest.alerts | map(attribute='created_timestamp') | list
            == al_newest.alerts | map(attribute='created_timestamp') | sort(reverse=true) | list
        fail_msg: "The test needs at least one alert, and the newest alerts must come first"
        quiet: true

    - name: "READ | Derive a filter that matches only the newest alerts"
      ansible.builtin.set_fact:
        al_since: "{{ (al_newest.alerts | last).created_timestamp }}"
        # The upper bound keeps alerts that arrive during the run out of the later searches.
        al_until: "{{ (al_newest.alerts | first).created_timestamp }}"
        al_newest_ids: "{{ al_newest.alerts | map(attribute='composite_id') | list }}"

    - name: "READ | Set the filter from the oldest of the newest alerts"
      ansible.builtin.set_fact:
        al_filter: "created_timestamp:>='{{ al_since }}'+created_timestamp:<='{{ al_until }}'"

    # =====================================================================
    # Phase 2: search with a filter and a sort
    # =====================================================================

    - name: "READ | Search with the derived filter, sorted by composite ID"
      crowdstrike.falcon.alert_info:
        filter: "{{ al_filter }}"
        sort: composite_id.asc
      register: al_by_cid
      no_log: true

    - name: "READ | Set the composite IDs of the filtered search"
      ansible.builtin.set_fact:
        al_cids: "{{ al_by_cid.alerts | map(attribute='composite_id') | list }}"

    - name: "READ | Verify the filter and the composite ID sort order"
      ansible.builtin.assert:
        that:
          - al_by_cid is not changed
          - al_cids | length >= al_newest_ids | length
          - al_cids | length == al_cids | unique | length
          - al_newest_ids | difference(al_cids) | length == 0
          - al_by_cid.alerts | rejectattr('created_timestamp', '>=', al_since) | list | length == 0
          - al_cids == al_cids | sort
        fail_msg: "The filter or the composite_id.asc sort returned unexpected data"
        quiet: true

    - name: "READ | Search with the derived filter, oldest first"
      crowdstrike.falcon.alert_info:
        filter: "{{ al_filter }}"
        sort: created_timestamp.asc
      register: al_by_created
      no_log: true

    - name: "READ | Verify the created_timestamp.asc sort order"
      ansible.builtin.assert:
        that:
          - al_by_created.alerts | length == al_cids | length
          - >-
            al_by_created.alerts | map(attribute='created_timestamp') | list
            == al_by_created.alerts | map(attribute='created_timestamp') | sort | list
          - >-
            al_by_created.alerts | map(attribute='composite_id') | sort | list
            == al_cids
        fail_msg: "The created_timestamp.asc sort returned unexpected data"
        quiet: true

    # =====================================================================
    # Phase 3: limit
    # =====================================================================

    - name: "READ | Search with the derived filter and a limit of 2"
      crowdstrike.falcon.alert_info:
        filter: "{{ al_filter }}"
        sort: composite_id.asc
        limit: 2
      register: al_limit
      no_log: true

    - name: "READ | Verify that the limit returns the first alerts of the same sort"
      ansible.builtin.assert:
        that:
          - al_limit.alerts | length <= 2
          - al_limit.alerts | length == [2, al_cids | length] | min
          - al_limit.alerts | map(attribute='composite_id') | list == al_cids[:2]
        fail_msg: "The limit did not return the first alerts of the sort"
        quiet: true

    # =====================================================================
    # Phase 4: get by composite ID
    # =====================================================================

    - name: "READ | Set the IDs to get, in reverse order, with a repeated ID"
      ansible.builtin.set_fact:
        al_get_ids: "{{ (al_cids[:3] | reverse | list) + [al_cids[:3] | last] }}"
        al_get_expected: "{{ al_cids[:3] | reverse | list }}"

    - name: "EXAMPLE | Get alerts by composite ID"
      crowdstrike.falcon.alert_info:
        composite_ids: "{{ al_get_ids }}"
      register: al_by_id
      no_log: true

    - name: "READ | Verify the order of the IDs and that a repeated ID gives one alert"
      ansible.builtin.assert:
        that:
          - al_by_id is not changed
          - al_get_expected | length > 0
          - al_get_ids | length == al_get_expected | length + 1
          - al_by_id.alerts | map(attribute='composite_id') | list == al_get_expected
        fail_msg: "Get by composite ID did not keep the order or did not remove the repeated ID"
        quiet: true

    - name: "READ | Set a missing ID with the CID of a real ID"
      ansible.builtin.set_fact:
        al_missing_id: >-
          {{ (al_cids[0].split(':')[:-1] + ['ffffffffffffffffffffffffffffffff']) | join(':') }}

    - name: "READ | Get a real ID and a missing ID"
      crowdstrike.falcon.alert_info:
        composite_ids:
          - "{{ al_cids[0] }}"
          - "{{ al_missing_id }}"
      register: al_missing
      # The failure message holds the ID, so the task must not fail on the console.
      # failed_when sets failed to false, so the assert reads the message and the errors.
      failed_when: false
      no_log: true

    - name: "READ | Verify that a missing ID fails and returns the alert that was found"
      ansible.builtin.assert:
        that:
          - "al_missing.msg == 'Alert not found: ' ~ al_missing_id"
          - al_missing.errors | selectattr('code', 'equalto', 404) | map(attribute='id') | list == [al_missing_id]
          - al_missing.alerts | map(attribute='composite_id') | list == [al_cids[0]]
        fail_msg: "A missing ID did not fail with 'Alert not found'"
        quiet: true

    # =====================================================================
    # Phase 5: a bad filter
    # =====================================================================

    - name: "READ | Search with a bad filter"
      crowdstrike.falcon.alert_info:
        filter: "status:"
      register: al_bad_filter
      ignore_errors: true

    - name: "READ | Verify that a bad filter fails with the API error"
      ansible.builtin.assert:
        that:
          - al_bad_filter is failed
          - "'invalid query filter' in al_bad_filter.msg"
        fail_msg: "A bad filter did not fail with the API error"

    # =====================================================================
    # Phase 6: check mode
    # =====================================================================

    - name: "READ | Search with the derived filter in check mode"
      crowdstrike.falcon.alert_info:
        filter: "{{ al_filter }}"
        sort: composite_id.asc
      check_mode: true
      register: al_check
      no_log: true

    - name: "READ | Verify that check mode returns the same data"
      ansible.builtin.assert:
        that:
          - al_check is not changed
          - al_check.alerts | map(attribute='composite_id') | list == al_cids
        fail_msg: "Check mode returned other data than a normal run"
        quiet: true

    # =====================================================================
    # Phase 7: the other EXAMPLES of the module
    # =====================================================================

    - name: "EXAMPLE | Get the closed endpoint alerts, newest first"
      crowdstrike.falcon.alert_info:
        filter: "status:'closed'+product:'epp'"
        sort: created_timestamp.desc
      register: al_ex_closed
      no_log: true

    - name: "READ | Verify the closed endpoint alerts"
      ansible.builtin.assert:
        that:
          - al_ex_closed is not changed
          - al_ex_closed.alerts | rejectattr('status', 'eq', 'closed') | list | length == 0
          - al_ex_closed.alerts | rejectattr('product', 'eq', 'epp') | list | length == 0
          - >-
            al_ex_closed.alerts | map(attribute='created_timestamp') | list
            == al_ex_closed.alerts | map(attribute='created_timestamp') | sort(reverse=true) | list
        fail_msg: "The closed endpoint alerts example returned unexpected data"
        quiet: true

    # The example has no limit. The limit keeps the read light on a tenant with many alerts.
    - name: "EXAMPLE | Get all alerts except the hidden alerts"
      crowdstrike.falcon.alert_info:
        filter: "show_in_ui:true"
        limit: 20
      register: al_ex_visible
      no_log: true

    - name: "READ | Verify that no hidden alert is returned"
      ansible.builtin.assert:
        that:
          - al_ex_visible is not changed
          - al_ex_visible.alerts | length > 0
          - al_ex_visible.alerts | length <= 20
          - al_ex_visible.alerts | rejectattr('show_in_ui') | list | length == 0
        fail_msg: "The show_in_ui:true example returned a hidden alert"
        quiet: true

    - name: "EXAMPLE | Get the open alerts of high severity"
      crowdstrike.falcon.alert_info:
        filter: "status:!'closed'+severity:>=70"
      register: al_ex_high
      no_log: true

    - name: "READ | Verify the open alerts of high severity"
      ansible.builtin.assert:
        that:
          - al_ex_high is not changed
          - al_ex_high.alerts | selectattr('status', 'eq', 'closed') | list | length == 0
          - al_ex_high.alerts | rejectattr('severity', 'defined') | list | length == 0
          - al_ex_high.alerts | rejectattr('severity', '>=', 70) | list | length == 0
        fail_msg: "The open high severity example returned unexpected data"
        quiet: true
