---
# Integration tests for the rtr connection plugin
#
# Requirements:
#   FALCON_CLIENT_ID         - API client ID
#   FALCON_CLIENT_SECRET     - API client secret
#   FALCON_CLOUD             - Falcon cloud region (optional, defaults to us-1)
#   FALCON_TEST_RTR_HOST     - device ID (AID) of a Linux, macOS or Windows test host
#                              that you own; set it to run these tests
#   FALCON_TEST_RTR_CONTAIN  - set to 1 to also contain the host, run tasks on it
#                              while it is contained, and lift containment
#
# The target reads the platform of the host with crowdstrike.falcon.host_info and
# runs posix.yml (Linux and macOS, needs /usr/bin/python3) or windows.yml (Windows,
# needs the ansible.windows collection on the controller; win_template of
# ansible.windows 2.5.0 does not render templates on ansible-core 2.22, 3.9.2 does,
# so use a current release). The host needs an RTR
# response policy that allows Real Time Response, custom scripts and the put command.
#
# API scopes: Real time response [READ, WRITE], Real time response (admin)
# [WRITE], Hosts [READ] (and Hosts [WRITE] with FALCON_TEST_RTR_CONTAIN)
#
# The tests run commands on the host as root (SYSTEM on Windows) and write only
# under /tmp/ansible-int-rtr-<timestamp>-<random> (C:\Windows\Temp\ansible-int-rtr-...
# on Windows), which the always section removes.
# The plugin makes RTR put-files named ansible-rtr-<uuid> for large uploads and
# deletes each one after the upload. The target counts these put-files before the
# first RTR task and checks at the end that the count did not grow, with the
# put-file filter name:*'ansible-rtr-*' (starts with, matched live). Other runs
# at the same time can add put-files, so the check allows the start count.
# With FALCON_TEST_RTR_CONTAIN=1 the host is network contained during the
# contain tasks, and the always section lifts containment.

- name: Validate required environment variables
  ansible.builtin.assert:
    that:
      - lookup('env', 'FALCON_CLIENT_ID') | length > 0
      - lookup('env', 'FALCON_CLIENT_SECRET') | length > 0
    fail_msg: "FALCON_CLIENT_ID and FALCON_CLIENT_SECRET environment variables must be set"

- name: "SKIP | Skip the RTR connection tests"
  ansible.builtin.debug:
    msg: "Set FALCON_TEST_RTR_HOST=<device ID> of a Linux, macOS or Windows test host that you own to run the RTR connection tests"
  when: lookup('env', 'FALCON_TEST_RTR_HOST') | length == 0

- name: Run RTR connection tests
  when: lookup('env', 'FALCON_TEST_RTR_HOST') | length > 0
  vars:
    # In vars and not set_fact: delegate_to is templated before when is checked
    rtr_host: ansible-int-rtr-host
    rtr_count_put_files: |
      import os
      from falconpy import RealTimeResponseAdmin
      admin = RealTimeResponseAdmin(
          client_id=os.environ["FALCON_CLIENT_ID"],
          client_secret=os.environ["FALCON_CLIENT_SECRET"],
          member_cid=os.environ.get("FALCON_MEMBER_CID") or None,
          base_url=os.environ.get("FALCON_CLOUD") or "us-1",
      )
      result = admin.list_put_files(filter="name:*'ansible-rtr-*'")
      if result["status_code"] != 200:
          raise SystemExit("list_put_files returned %s" % result["status_code"])
      print(len(result["body"].get("resources") or []))
  block:
    - name: "SETUP | Count the RTR put-files before the tests"
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -c
          - "{{ rtr_count_put_files }}"
      changed_when: false
      register: rtr_put_files_start

    - name: "SETUP | Set test variables"
      ansible.builtin.set_fact:
        rtr_device_id: "{{ lookup('env', 'FALCON_TEST_RTR_HOST') }}"
        rtr_contain: "{{ lookup('env', 'FALCON_TEST_RTR_CONTAIN') == '1' }}"
        rtr_prefix: >-
          ansible-int-rtr-{{ now(utc=true).strftime('%Y%m%dt%H%M%S') }}-{{ 999999 | random }}

    - name: "SETUP | Read the platform of the host"
      crowdstrike.falcon.host_info:
        hosts:
          - "{{ rtr_device_id }}"
      register: rtr_host_platform
      no_log: true

    - name: "SETUP | Verify that the host was found"
      ansible.builtin.assert:
        that:
          - rtr_host_platform.hosts | length == 1
        fail_msg: "FALCON_TEST_RTR_HOST is not a host in this tenant"
        quiet: true

    - name: "SETUP | Set the test paths"
      ansible.builtin.set_fact:
        rtr_windows: "{{ rtr_host_platform.hosts[0].platform_name == 'Windows' }}"
        rtr_dir: >-
          {{ 'C:\\Windows\\Temp\\' ~ rtr_prefix
             if rtr_host_platform.hosts[0].platform_name == 'Windows'
             else '/tmp/' ~ rtr_prefix }}

    - name: "SETUP | Add the RTR host (Linux or macOS)"
      ansible.builtin.add_host:
        name: "{{ rtr_host }}"
        ansible_connection: crowdstrike.falcon.rtr
        ansible_rtr_device_id: "{{ rtr_device_id }}"
        ansible_python_interpreter: /usr/bin/python3
        ansible_falcon_cloud: "{{ lookup('env', 'FALCON_CLOUD') | default('us-1', true) }}"
      when: not rtr_windows

    - name: "SETUP | Add the RTR host (Windows)"
      ansible.builtin.add_host:
        name: "{{ rtr_host }}"
        ansible_connection: crowdstrike.falcon.rtr
        ansible_rtr_device_id: "{{ rtr_device_id }}"
        ansible_shell_type: powershell
        ansible_falcon_cloud: "{{ lookup('env', 'FALCON_CLOUD') | default('us-1', true) }}"
      when: rtr_windows

    - name: "SETUP | Make a local temporary directory"
      ansible.builtin.tempfile:
        state: directory
        prefix: ansible-int-rtr-
      register: rtr_local_tmp

    - name: "SETUP | Make a 300 KB file on the controller"
      ansible.builtin.command:
        argv:
          - dd
          - if=/dev/urandom
          - "of={{ rtr_local_tmp.path }}/big.bin"
          - bs=1024
          - count=300
        creates: "{{ rtr_local_tmp.path }}/big.bin"

    - name: "SETUP | Get the checksum of the local file"
      ansible.builtin.stat:
        path: "{{ rtr_local_tmp.path }}/big.bin"
        checksum_algorithm: sha256
      register: rtr_big_local

    - name: Run the tasks for the platform of the host
      ansible.builtin.include_tasks: "{{ 'windows.yml' if rtr_windows else 'posix.yml' }}"
      vars:
        rtr_phase: all

    - name: Run the tests on a contained host
      when: rtr_contain | bool
      block:
        - name: "CONTAIN | Read the host status"
          crowdstrike.falcon.host_info:
            hosts:
              - "{{ rtr_device_id }}"
          register: rtr_host_before
          no_log: true

        - name: "CONTAIN | Verify that the host is not contained"
          ansible.builtin.assert:
            that:
              - rtr_host_before.hosts | length == 1
              - rtr_host_before.hosts[0].status == 'normal'
            fail_msg: "The test host must have the status normal before the containment tests"
            quiet: true

        - name: "CONTAIN | Contain the host"
          crowdstrike.falcon.host_contain:
            hosts:
              - "{{ rtr_device_id }}"
            contained: true
          register: rtr_contain_result

        - name: "CONTAIN | Verify the contain request"
          ansible.builtin.assert:
            that:
              - rtr_contain_result is changed
              - rtr_contain_result.hosts == [rtr_device_id]
              - rtr_contain_result.failed_hosts | length == 0
            quiet: true

        - name: "CONTAIN | Wait until the host is contained"
          crowdstrike.falcon.host_info:
            hosts:
              - "{{ rtr_device_id }}"
          register: rtr_host_contained
          until: rtr_host_contained.hosts[0].status | default('') == 'contained'
          retries: 30
          delay: 5
          no_log: true

        # RTR answered 404 "Could not establish sensor comms" once right after the
        # status turned contained; give the sensor time to connect again.
        - name: "CONTAIN | Wait for the sensor to connect again"
          ansible.builtin.wait_for:
            timeout: 60

        - name: "CONTAIN | Run the tasks on the contained host"
          ansible.builtin.include_tasks: "{{ 'windows.yml' if rtr_windows else 'posix.yml' }}"
          vars:
            rtr_phase: contained

        - name: "CONTAIN | Verify the tasks on the contained host"
          ansible.builtin.assert:
            that:
              - rtr_ping_contained is not unreachable
              - rtr_cmd_contained is not unreachable
              - rtr_copy_contained is not unreachable
              - rtr_big_contained is not unreachable
              - rtr_ping_contained.ping == 'pong'
              - rtr_cmd_contained.stdout | trim == 'contained'
              - rtr_copy_contained is changed
              - rtr_big_contained.stat.checksum == rtr_big_local.stat.checksum

      always:
        - name: "CONTAIN | Lift containment"
          crowdstrike.falcon.host_contain:
            hosts:
              - "{{ rtr_device_id }}"
            contained: false
          register: rtr_lift
          failed_when: false
          when: rtr_contain_result is defined and rtr_contain_result is not skipped

        - name: "CONTAIN | Wait until the host status is normal"
          crowdstrike.falcon.host_info:
            hosts:
              - "{{ rtr_device_id }}"
          register: rtr_host_lifted
          until: rtr_host_lifted.hosts[0].status | default('') == 'normal'
          retries: 30
          delay: 5
          no_log: true
          when: rtr_contain_result is defined and rtr_contain_result is not skipped

  always:
    - name: "CLEANUP | Remove the test directory on the host (Linux or macOS)"
      ansible.builtin.file:
        path: "{{ rtr_dir }}"
        state: absent
      delegate_to: "{{ rtr_host }}"
      failed_when: false
      when: rtr_dir is defined and not rtr_windows

    - name: "CLEANUP | Remove the test directory on the host (Windows)"
      ansible.windows.win_file:
        path: "{{ rtr_dir }}"
        state: absent
      delegate_to: "{{ rtr_host }}"
      failed_when: false
      when: rtr_dir is defined and rtr_windows

    - name: "CLEANUP | Remove the local temporary directory"
      ansible.builtin.file:
        path: "{{ rtr_local_tmp.path }}"
        state: absent
      when: rtr_local_tmp.path is defined

    - name: "CLEANUP | Count the RTR put-files that the plugin left"
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter }}"
          - -c
          - "{{ rtr_count_put_files }}"
      changed_when: false
      register: rtr_put_files
      when: rtr_put_files_start.stdout is defined

    - name: "CLEANUP | Verify that the plugin left no put-file"
      ansible.builtin.assert:
        that:
          - rtr_put_files.stdout | trim | int <= rtr_put_files_start.stdout | trim | int
        fail_msg: "RTR put-files named ansible-rtr-* are left in the tenant"
      when: rtr_put_files_start.stdout is defined
