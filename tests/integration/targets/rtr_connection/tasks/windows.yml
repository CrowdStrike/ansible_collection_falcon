---
# Tasks of the rtr_connection target for Windows hosts (the powershell shell).
# main.yml includes this file with rtr_phase 'all' for the full set of tasks,
# and with rtr_phase 'contained' for the tasks that run while the host is contained.
# Ansible pipelines every Windows module, so each module task also tests the
# upload of the module data to the stdin of the command.

- name: Run the tasks on the host
  when: rtr_phase == 'all'
  block:
    - name: "PING | Ping the host over RTR"
      ansible.windows.win_ping:
      delegate_to: "{{ rtr_host }}"
      register: rtr_ping

    - name: "PING | Verify the ping"
      ansible.builtin.assert:
        that:
          - rtr_ping.ping == 'pong'

    - name: "COMMAND | Run a command"
      ansible.windows.win_command:
        argv:
          - cmd.exe
          - /c
          - "echo {{ rtr_prefix }}"
      delegate_to: "{{ rtr_host }}"
      changed_when: false
      register: rtr_cmd

    - name: "COMMAND | Verify the command result"
      ansible.builtin.assert:
        that:
          - rtr_cmd.rc == 0
          - rtr_cmd.stdout | trim == rtr_prefix
          - rtr_cmd.stderr == ''

    - name: "COMMAND | Run a command that exits 3"
      ansible.windows.win_shell: |
        Write-Output 'to-stdout'
        [Console]::Error.WriteLine('to-stderr')
        exit 3
      delegate_to: "{{ rtr_host }}"
      changed_when: false
      failed_when: false
      register: rtr_cmd_rc3

    - name: "COMMAND | Verify the exit code and that stdout and stderr are apart"
      ansible.builtin.assert:
        that:
          - rtr_cmd_rc3.rc == 3
          - rtr_cmd_rc3.stdout | trim == 'to-stdout'
          - rtr_cmd_rc3.stderr | trim == 'to-stderr'

    - name: "COMMAND | Read the user"
      ansible.windows.win_command: whoami.exe
      delegate_to: "{{ rtr_host }}"
      changed_when: false
      register: rtr_whoami

    - name: "COMMAND | Verify that tasks run as SYSTEM"
      ansible.builtin.assert:
        that:
          - rtr_whoami.stdout | trim | lower == 'nt authority\\system'

    - name: "RAW | Run a raw command with quotes, a dollar sign and a backtick"
      ansible.builtin.raw: >-
        Write-Output ('dq-"x" sq-''y'' dollar-$HOME tick-' + [char]96)
      delegate_to: "{{ rtr_host }}"
      changed_when: false
      register: rtr_raw

    - name: "RAW | Verify the raw output"
      ansible.builtin.assert:
        that:
          - rtr_raw.rc == 0
          - rtr_raw.stdout | trim == rtr_raw_expected
      vars:
        rtr_raw_expected: >-
          dq-"x" sq-'y' dollar-$HOME tick-`

    - name: "FILE | Make the test directory"
      ansible.windows.win_file:
        path: "{{ rtr_dir }}"
        state: directory
      delegate_to: "{{ rtr_host }}"
      register: rtr_mkdir

    - name: "FILE | Verify the directory was made"
      ansible.builtin.assert:
        that:
          - rtr_mkdir is changed

    - name: "COPY | Copy a small file (inline upload)"
      ansible.windows.win_copy:
        content: "{{ rtr_prefix }}\n"
        dest: "{{ rtr_dir }}\\small.txt"
      delegate_to: "{{ rtr_host }}"
      register: rtr_copy_small

    - name: "COPY | Copy the same small file again"
      ansible.windows.win_copy:
        content: "{{ rtr_prefix }}\n"
        dest: "{{ rtr_dir }}\\small.txt"
      delegate_to: "{{ rtr_host }}"
      register: rtr_copy_small_again

    - name: "COPY | Read the small file"
      ansible.builtin.slurp:
        src: "{{ rtr_dir }}\\small.txt"
      delegate_to: "{{ rtr_host }}"
      register: rtr_small_content

    - name: "COPY | Verify the small copy and its idempotence"
      ansible.builtin.assert:
        that:
          - rtr_copy_small is changed
          - rtr_copy_small_again is not changed
          - rtr_small_content.content | b64decode | trim == rtr_prefix

    - name: "COPY | Copy the 300 KB file (put-file upload)"
      ansible.windows.win_copy:
        src: "{{ rtr_local_tmp.path }}/big.bin"
        dest: "{{ rtr_dir }}\\big.bin"
      delegate_to: "{{ rtr_host }}"
      register: rtr_copy_big

    - name: "COPY | Get the checksum of the file on the host"
      ansible.windows.win_stat:
        path: "{{ rtr_dir }}\\big.bin"
        get_checksum: true
        checksum_algorithm: sha256
      delegate_to: "{{ rtr_host }}"
      register: rtr_big_remote

    - name: "COPY | Verify the large copy"
      ansible.builtin.assert:
        that:
          - rtr_copy_big is changed
          - rtr_big_remote.stat.exists
          - rtr_big_remote.stat.size == 307200
          - rtr_big_remote.stat.checksum == rtr_big_local.stat.checksum

    - name: "TEMPLATE | Render a template on the host"
      ansible.windows.win_template:
        src: rtr_test.conf.j2
        dest: "{{ rtr_dir }}\\rtr_test.conf"
        newline_sequence: "\n"
      delegate_to: "{{ rtr_host }}"
      register: rtr_template
      vars:
        rtr_tpl_value: "dollar-$HOME"

    - name: "TEMPLATE | Read the rendered file"
      ansible.builtin.slurp:
        src: "{{ rtr_dir }}\\rtr_test.conf"
      delegate_to: "{{ rtr_host }}"
      register: rtr_template_content

    - name: "TEMPLATE | Verify the rendered file"
      ansible.builtin.assert:
        that:
          - rtr_template is changed
          - (rtr_template_content.content | b64decode).splitlines() == ['host=dollar-$HOME', 'prefix=' ~ rtr_prefix]

    - name: "FETCH | Fetch the 300 KB file back"
      ansible.builtin.fetch:
        src: "{{ rtr_dir }}\\big.bin"
        dest: "{{ rtr_local_tmp.path }}/fetched.bin"
        flat: true
      delegate_to: "{{ rtr_host }}"
      register: rtr_fetch

    - name: "FETCH | Get the checksum of the fetched file"
      ansible.builtin.stat:
        path: "{{ rtr_local_tmp.path }}/fetched.bin"
        checksum_algorithm: sha256
      register: rtr_fetched_local

    - name: "FETCH | Verify the fetched file"
      ansible.builtin.assert:
        that:
          - rtr_fetch is changed
          - rtr_fetched_local.stat.exists
          - rtr_fetched_local.stat.checksum == rtr_big_local.stat.checksum

    - name: "FETCH | Fetch a file that does not exist"
      ansible.builtin.fetch:
        src: "{{ rtr_dir }}\\missing.txt"
        dest: "{{ rtr_local_tmp.path }}/missing.txt"
        flat: true
      delegate_to: "{{ rtr_host }}"
      failed_when: false
      register: rtr_fetch_missing

    - name: "FETCH | Verify the missing file result"
      ansible.builtin.assert:
        that:
          - rtr_fetch_missing.msg is search('does not exist')

    - name: "SCRIPT | Make a local PowerShell script"
      ansible.builtin.copy:
        content: |
          Write-Output "script-{{ rtr_prefix }}"
        dest: "{{ rtr_local_tmp.path }}/test.ps1"
        mode: "0600"

    - name: "SCRIPT | Run the script on the host"
      ansible.builtin.script: "{{ rtr_local_tmp.path }}/test.ps1"
      delegate_to: "{{ rtr_host }}"
      register: rtr_script

    - name: "SCRIPT | Verify the script output"
      ansible.builtin.assert:
        that:
          - rtr_script.rc == 0
          - rtr_script.stdout | trim == 'script-' ~ rtr_prefix

    - name: "ASYNC | Start a task in the background"
      ansible.windows.win_command:
        argv:
          - cmd.exe
          - /c
          - echo async-done
      async: 120
      poll: 0
      delegate_to: "{{ rtr_host }}"
      register: rtr_async

    - name: "ASYNC | Wait for the background task"
      ansible.builtin.async_status:
        jid: "{{ rtr_async.ansible_job_id }}"
      delegate_to: "{{ rtr_host }}"
      register: rtr_async_job
      until: rtr_async_job.finished
      retries: 20
      delay: 3

    - name: "ASYNC | Verify the background task"
      ansible.builtin.assert:
        that:
          - rtr_async_job.rc == 0
          - rtr_async_job.stdout | trim == 'async-done'

    - name: "SETUP | Gather the min facts of the host"
      ansible.builtin.setup:
        gather_subset:
          - min
      delegate_to: "{{ rtr_host }}"
      register: rtr_facts

    - name: "SETUP | Verify the facts"
      ansible.builtin.assert:
        that:
          - rtr_facts.ansible_facts.ansible_os_family == 'Windows'

# ignore_unreachable: an unreachable task would skip the always sections of main.yml,
# and the host would stay contained. main.yml asserts the results.
- name: "CONTAIN | Ping the contained host over RTR"
  ansible.windows.win_ping:
  delegate_to: "{{ rtr_host }}"
  register: rtr_ping_contained
  ignore_unreachable: true
  when: rtr_phase == 'contained'

- name: "CONTAIN | Run a command on the contained host"
  ansible.windows.win_command:
    argv:
      - cmd.exe
      - /c
      - echo contained
  delegate_to: "{{ rtr_host }}"
  changed_when: false
  register: rtr_cmd_contained
  ignore_unreachable: true
  when: rtr_phase == 'contained'

- name: "CONTAIN | Copy the 300 KB file to the contained host"
  ansible.windows.win_copy:
    src: "{{ rtr_local_tmp.path }}/big.bin"
    dest: "{{ rtr_dir }}\\big-contained.bin"
  delegate_to: "{{ rtr_host }}"
  register: rtr_copy_contained
  ignore_unreachable: true
  when: rtr_phase == 'contained'

- name: "CONTAIN | Get the checksum of the copy on the contained host"
  ansible.windows.win_stat:
    path: "{{ rtr_dir }}\\big-contained.bin"
    get_checksum: true
    checksum_algorithm: sha256
  delegate_to: "{{ rtr_host }}"
  register: rtr_big_contained
  ignore_unreachable: true
  when: rtr_phase == 'contained'
