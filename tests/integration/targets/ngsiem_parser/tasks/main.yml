---
# Integration tests for ngsiem_parser and ngsiem_parser_info modules
#
# Requirements:
#   FALCON_CLIENT_ID     - API client ID
#   FALCON_CLIENT_SECRET - API client secret
#   FALCON_CLOUD         - Falcon cloud region (optional, defaults to us-1)
#
# API scopes: NGSIEM Parsers [READ, WRITE]
#
# Custom parsers auto-increment their version on each update/clone, so the
# returned parser ID is version-suffixed and changes after an update. These
# tests key idempotency on parser content, not on the ID.
#
# All parser names start with a prefix that is unique to this run. The API
# stores a custom parser or a clone as 'custom-<name>', and an extension as
# '<base parser>-<name>'. The name filter of ngsiem_parser_info is a substring
# match that ignores case, so the prefix finds all three. The cleanup deletes
# only the parsers whose names contain the prefix of this run.

- name: Gather minimal facts for timestamp
  ansible.builtin.setup:
    gather_subset:
      - date_time

- name: Validate required environment variables
  ansible.builtin.assert:
    that:
      - lookup('env', 'FALCON_CLIENT_ID') | length > 0
      - lookup('env', 'FALCON_CLIENT_SECRET') | length > 0
    fail_msg: "FALCON_CLIENT_ID and FALCON_CLIENT_SECRET environment variables must be set"

- name: Set test variables
  ansible.builtin.set_fact:
    # Lowercase, because the API stores parser names in lowercase
    parser_prefix: "ansible-int-parser-{{ ansible_facts.date_time.iso8601_basic_short | lower }}"

- name: Set test parser names and templates
  ansible.builtin.set_fact:
    test_parser_name: "{{ parser_prefix }}-main"
    test_clone_name: "{{ parser_prefix }}-clone"
    test_ext_name: "{{ parser_prefix }}-ext"
    # The API stores custom parsers as 'custom-<name>'
    test_parser_names: ["{{ parser_prefix }}-main", "custom-{{ parser_prefix }}-main"]
    test_clone_names: ["{{ parser_prefix }}-clone", "custom-{{ parser_prefix }}-clone"]
    # A minimal valid parser. The script must emit all mandatory tag fields and
    # tagFields must enumerate every one of them, or create returns 400.
    test_parser_yaml: |
      $schema: https://schemas.humio.com/parser/v0.3.0
      name: {{ parser_prefix }}-main
      fieldsToBeRemovedBeforeParsing: []
      testCases: []
      script: |-
        parseJson()
        | Cps.version := "1.0.0"
        | Vendor := "ansible"
        | ecs.version := "9.0.0"
        | event.dataset := "ansible.test"
        | event.kind := "event"
        | event.module := "ansible"
        | event.outcome := "success"
        | observer.type := "test"
      tagFields:
        - Cps.version
        - Vendor
        - ecs.version
        - event.dataset
        - event.kind
        - event.module
        - event.outcome
        - observer.type

- name: Set the updated parser template
  ansible.builtin.set_fact:
    test_parser_yaml_updated: "{{ test_parser_yaml | replace('event.dataset := \"ansible.test\"', 'event.dataset := \"ansible.updated\"') }}"

- name: Run CRUD lifecycle tests
  block:
    # =====================================================================
    # Phase 1: CREATE
    # =====================================================================

    - name: "CREATE | Create a custom parser from a YAML template"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_parser_name }}"
        parser_yaml: "{{ test_parser_yaml }}"
      register: create_result

    - name: "CREATE | Verify parser was created"
      ansible.builtin.assert:
        that:
          - create_result is changed
          - create_result.parser is defined
          - create_result.parser.name in test_parser_names
          - create_result.parser.id | length > 0
          - create_result.parser.script is defined
        fail_msg: "Parser creation failed or returned unexpected data"

    - name: Save parser ID
      ansible.builtin.set_fact:
        parser_id: "{{ create_result.parser.id }}"

    # =====================================================================
    # Phase 2: READ - Verify via info module
    # =====================================================================

    - name: "READ | Get parser by ID with full definition"
      crowdstrike.falcon.ngsiem_parser_info:
        parser_ids:
          - "{{ parser_id }}"
      register: info_by_id

    - name: "READ | Verify info by ID"
      ansible.builtin.assert:
        that:
          - info_by_id.parsers | length == 1
          - info_by_id.parsers[0].id == parser_id
          - info_by_id.parsers[0].name in test_parser_names
          - info_by_id.parsers[0].script is defined
        fail_msg: "Info lookup by ID returned unexpected data"

    - name: "READ | Search parsers by name substring"
      crowdstrike.falcon.ngsiem_parser_info:
        name: "{{ test_parser_name }}"
        parser_type: custom
      register: info_by_name

    - name: "READ | Verify name search found the parser"
      ansible.builtin.assert:
        that:
          - >-
            info_by_name.parsers
            | selectattr('name', 'in', test_parser_names)
            | list | length == 1
        fail_msg: "Name search did not find the created parser"

    - name: "READ | List custom parsers metadata only (no definitions)"
      crowdstrike.falcon.ngsiem_parser_info:
        parser_type: custom
        definitions: false
      register: info_metadata

    - name: "READ | Verify metadata-only results omit script"
      ansible.builtin.assert:
        that:
          - info_metadata.parsers | length >= 1
          - info_metadata.meta.pagination is defined
        fail_msg: "Metadata-only listing returned unexpected data"

    # =====================================================================
    # Phase 3: IDEMPOTENCY - Re-run with identical content
    # =====================================================================

    - name: "IDEMPOTENT | Re-run create with identical YAML"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_parser_name }}"
        parser_yaml: "{{ test_parser_yaml }}"
      register: idempotent_result

    - name: "IDEMPOTENT | Verify no change for identical content"
      ansible.builtin.assert:
        that:
          - idempotent_result is not changed
        fail_msg: "Module should not report a change when content is unchanged"

    # =====================================================================
    # Phase 3b: UPDATE - change the script, then re-run the update
    # =====================================================================

    - name: "UPDATE | Update the parser script by name"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_parser_name }}"
        parser_yaml: "{{ test_parser_yaml_updated }}"
      register: update_result

    - name: "UPDATE | Verify the parser was updated"
      ansible.builtin.assert:
        that:
          - update_result is changed
          - update_result.parser.name in test_parser_names
          - "'ansible.updated' in update_result.parser.script"
        fail_msg: "Updating the parser script failed"

    - name: Save the parser ID of the new version
      ansible.builtin.set_fact:
        parser_id: "{{ update_result.parser.id }}"

    - name: "UPDATE | Re-run the same update"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_parser_name }}"
        parser_yaml: "{{ test_parser_yaml_updated }}"
      register: update_again

    - name: "UPDATE | Verify no change on repeat"
      ansible.builtin.assert:
        that:
          - update_again is not changed
          - update_again.parser.id == parser_id
        fail_msg: "Re-running the update with the same content should not change the parser"

    # =====================================================================
    # Phase 4: CHECK MODE
    # =====================================================================

    - name: "CHECK | Create a parser in check mode"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ parser_prefix }}-check"
        parser_yaml: "{{ test_parser_yaml }}"
      check_mode: true
      register: check_create

    - name: "CHECK | Look for the check mode parser"
      crowdstrike.falcon.ngsiem_parser_info:
        name: "{{ parser_prefix }}-check"
        definitions: false
      register: check_create_info

    - name: "CHECK | Verify check mode predicted the create and made nothing"
      ansible.builtin.assert:
        that:
          - check_create is changed
          - check_create_info.parsers | length == 0
        fail_msg: "Check mode must report the create without making the parser"

    - name: "CHECK | Delete in check mode (should report change, not mutate)"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_parser_name }}"
        state: absent
      check_mode: true
      register: check_delete

    - name: "CHECK | Verify check mode reported intended change"
      ansible.builtin.assert:
        that:
          - check_delete is changed
        fail_msg: "Check mode should report a change without mutating"

    - name: "CHECK | Confirm parser still exists after check-mode delete"
      crowdstrike.falcon.ngsiem_parser_info:
        parser_ids:
          - "{{ parser_id }}"
      register: check_still_there

    - name: "CHECK | Verify parser was not actually deleted"
      ansible.builtin.assert:
        that:
          - check_still_there.parsers | length == 1
        fail_msg: "Check mode must not delete the parser"

    # =====================================================================
    # Phase 5: CLONE
    # =====================================================================

    - name: "CLONE | Clone the parser into a new one"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_clone_name }}"
        clone_from: "{{ parser_id }}"
      register: clone_result

    - name: "CLONE | Verify clone was created"
      ansible.builtin.assert:
        that:
          - clone_result is changed
          - clone_result.parser.name in test_clone_names
          - clone_result.parser.id | length > 0
        fail_msg: "Clone failed or returned unexpected data"

    # =====================================================================
    # Phase 6: EXTENSION (requires a CrowdStrike-managed OOTB base parser)
    # =====================================================================

    # Not every OOTB parser can be extended, so use a known one
    - name: "EXT | Find the microsoft-edge OOTB parser to extend"
      crowdstrike.falcon.ngsiem_parser_info:
        name: microsoft-edge
        parser_type: ootb
        definitions: false
      register: ootb_found

    - name: "EXT | Keep only the exact match"
      ansible.builtin.set_fact:
        ootb_parsers:
          parsers: "{{ ootb_found.parsers | selectattr('name', 'equalto', 'microsoft-edge') | list }}"

    - name: "EXT | Create an extension of the OOTB base parser (unversioned ID)"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_ext_name }}"
        extension_of: "{{ ootb_parsers.parsers[0].id | regex_replace(':.*$', '') }}"
      register: ext_result
      when: ootb_parsers.parsers | length > 0

    # The API names an extension '<base parser>-<name>'
    - name: "EXT | Verify extension was created"
      ansible.builtin.assert:
        that:
          - ext_result is changed
          - ext_result.parser.id | length > 0
          - ext_result.parser.name == 'microsoft-edge-' ~ test_ext_name
        fail_msg: "Extension creation failed"
      when: ootb_parsers.parsers | length > 0

    # A second create_parser_extension with the same name returns 404
    # 'parser not found', so the module must find the extension
    - name: "EXT | Re-run the extension create"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_ext_name }}"
        extension_of: "{{ ootb_parsers.parsers[0].id | regex_replace(':.*$', '') }}"
      register: ext_again
      when: ootb_parsers.parsers | length > 0

    - name: "EXT | Verify the extension was not created again"
      ansible.builtin.assert:
        that:
          - ext_again is not changed
          - ext_again.parser.id == ext_result.parser.id
        fail_msg: "Re-running the extension create must find the extension"
      when: ootb_parsers.parsers | length > 0

    - name: "EXT | Find the extension by type"
      crowdstrike.falcon.ngsiem_parser_info:
        name: "{{ test_ext_name }}"
        parser_type: extension
        definitions: false
      register: ext_info
      when: ootb_parsers.parsers | length > 0

    - name: "EXT | Verify the type filter found the extension"
      ansible.builtin.assert:
        that:
          - ext_info.parsers | map(attribute='id') | list == [ext_result.parser.id]
          - ext_info.parsers[0].parser_type == 'extension'
        fail_msg: "parser_type=extension did not find the extension"
      when: ootb_parsers.parsers | length > 0

    - name: "EXT | Delete the extension in check mode by the name it was created with"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_ext_name }}"
        state: absent
      check_mode: true
      register: ext_check_delete
      when: ootb_parsers.parsers | length > 0

    - name: "EXT | Delete the extension by the name it was created with"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_ext_name }}"
        state: absent
      register: ext_delete
      when: ootb_parsers.parsers | length > 0

    - name: "EXT | Delete the extension again"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_ext_name }}"
        extension_of: "{{ ootb_parsers.parsers[0].id | regex_replace(':.*$', '') }}"
        state: absent
      register: ext_delete_again
      when: ootb_parsers.parsers | length > 0

    - name: "EXT | Verify the extension was deleted"
      ansible.builtin.assert:
        that:
          - ext_check_delete is changed
          - ext_delete is changed
          - ext_delete_again is not changed
        fail_msg: "Deleting the extension by name failed or was not idempotent"
      when: ootb_parsers.parsers | length > 0

    # =====================================================================
    # Phase 7: AUTH TOKEN PASSTHROUGH
    # =====================================================================

    - name: "AUTH | Generate access token via auth module"
      crowdstrike.falcon.auth:
      register: falcon_auth

    - name: "AUTH | Query using access token"
      crowdstrike.falcon.ngsiem_parser_info:
        auth: "{{ falcon_auth.auth }}"
        parser_ids:
          - "{{ parser_id }}"
      register: auth_info

    - name: "AUTH | Verify token auth query succeeded"
      ansible.builtin.assert:
        that:
          - auth_info.parsers | length == 1
        fail_msg: "Query with token auth failed"

    # =====================================================================
    # Phase 8: ABSENT IDEMPOTENCY (non-existent parser)
    # =====================================================================

    - name: "ABSENT | Delete non-existent parser by name (idempotent)"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ parser_prefix }}-missing"
        state: absent
      register: absent_noop

    - name: "ABSENT | Verify no change for non-existent parser"
      ansible.builtin.assert:
        that:
          - absent_noop is not changed
        fail_msg: "Absent state should be a no-op for non-existent parsers"

    # =====================================================================
    # Phase 9: DELETE
    # =====================================================================

    - name: "DELETE | Remove the parser by name"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_parser_name }}"
        state: absent
      register: delete_result

    - name: "DELETE | Delete it again"
      crowdstrike.falcon.ngsiem_parser:
        name: "{{ test_parser_name }}"
        state: absent
      register: delete_again

    - name: "DELETE | Verify parser was deleted"
      ansible.builtin.assert:
        that:
          - delete_result is changed
          - delete_again is not changed
        fail_msg: "Parser deletion failed or was not idempotent"

  # =======================================================================
  # ALWAYS: Best-effort cleanup of everything this test may have created
  # =======================================================================
  always:
    # No parser_type filter, so that the search also finds the extension
    - name: "CLEANUP | Find any leftover test parsers"
      crowdstrike.falcon.ngsiem_parser_info:
        name: "{{ parser_prefix }}"
        definitions: false
      register: leftover_parsers
      failed_when: false

    # The name filter is a substring match, so keep only the custom parsers and
    # extensions whose names contain the prefix of this run
    - name: "CLEANUP | Delete leftover test parsers by ID"
      crowdstrike.falcon.ngsiem_parser:
        parser_id: "{{ item.id }}"
        state: absent
      loop: >-
        {{ leftover_parsers.parsers | default([])
           | selectattr('name', 'search', parser_prefix ~ '-')
           | selectattr('parser_type', 'in', ['custom', 'extension'])
           | list }}
      loop_control:
        label: "{{ item.name | default(item.id) }}"
      failed_when: false
