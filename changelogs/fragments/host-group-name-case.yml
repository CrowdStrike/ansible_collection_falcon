---
bugfixes:
  - host_group - find an existing host group by ``name`` when the name has uppercase letters. The API name filter only matches the lowercase form of a name, so a second run with ``state=present`` tried to create the group again and failed with ``Duplicate group name``, and ``state=absent`` did not delete the group. The name match is not case-sensitive, because the API does not allow two groups whose names differ only in case.
