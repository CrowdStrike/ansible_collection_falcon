---
# vars file for falcon_install
linux_packagers: "{{ rpm_packagers + dpkg_packagers }}"

rpm_packagers:
  - yum
  - rpm
  - dnf
  - zypper

dpkg_packagers:
  - apt

falcon_gpg_keys:
  - falcon-sensor.gpg
  - falcon-sensor1.gpg
  - falcon-sensor2.gpg
  - falcon-sensor3.gpg

latest_gpg_key: "{{ falcon_gpg_keys[0] }}"

falcon_os_arch_dict:
  x86_64: "+architectures:'x86_64'"
  aarch64: "+architectures:'arm64'"
  s390x: "+architectures:'s390x'"
