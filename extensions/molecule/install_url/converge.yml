---
- name: Converge
  hosts: all
  tasks:
    - name: Install the dummy sensor from a URL
      ansible.builtin.include_role:
        name: crowdstrike.falcon.falcon_install
      vars:
        falcon_install_method: url
        falcon_download_url: >-
          http://127.0.0.1:{{ falcon_test_http_port }}/falcon-sensor-7.0.0.{{ falcon_test_pkg_ext }}
        # current behavior: the role asks for a CID with the url method,
        # also on Linux where the install does not use it
        falcon_cid: "{{ falcon_test_cid }}"
